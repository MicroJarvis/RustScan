[package]
name = "rust-viewer"
version = "0.1.0"
edition = "2021"
description = "Interactive 3D viewer for RustScan SLAM results"

[[bin]]
name = "rust-viewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.34.3"
glam = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.14"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }
blake3 = "1"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
image = "0.25"
crossbeam-channel = "0.5"
rustslam = { path = "../RustSLAM", default-features = false, features = ["viewer-types"] }
rustgs = { path = "../RustGS", default-features = false, features = ["gpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSValue", "NSString", "NSURL"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-foundation", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer"] }

[dev-dependencies]
tempfile = "3.3"
