name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev \
            libeigen3-dev
      - name: Format
        run: cargo fmt --check
      - name: Forbid CPU glam types
        run: python3 scripts/check_cpu_glam.py
      - name: Workspace check
        run: cargo check --workspace --all-targets
      - name: rustscan-types tests
        run: cargo test -p rustscan-types --lib
      - name: RustFF tests
        run: cargo test -p rustscan-ff --lib
      - name: RustGS tests
        run: cargo test -p rustscan-gs --all-targets
      - name: RustViewer tests
        run: cargo test -p rustscan-viewer --all-targets
      - name: RustScan CLI tests
        run: cargo test -p rustscan --all-targets
      - name: RustMesh tests
        working-directory: rustscan-mesh
        run: cargo test
      - name: RustSLAM tests (including E2E)
        working-directory: rustscan-slam
        env:
          RUSTSCAN_E2E: "1"
        run: cargo test

  rustsfm-sparse-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            pkg-config \
            libeigen3-dev \
            libvulkan1 \
            mesa-vulkan-drivers
      - name: RustSFM format
        run: cargo fmt --package rustscan-sfm --check
      - name: RustSFM no-default compile gate
        run: cargo check -p rustscan-sfm --no-default-features --all-targets
      - name: RustSFM library tests
        run: >-
          cargo test -p rustscan-sfm --lib
          --features gpu-wgpu,vlfeat-sift
          -- --test-threads=1
      - name: RustSFM GPU integration tests
        env:
          WGPU_BACKEND: vulkan
        run: >-
          cargo test -p rustscan-sfm
          --test adaptive_keyframes
          --test build_support
          --test sequence_registration
          --no-default-features
          --features gpu-wgpu,vlfeat-sift
          -- --test-threads=1

  rustsfm-flowers2-parity-opt-in:
    # Opt-in only: provisions the pinned flowers2_colmap fixture from the
    # committed reference text and runs ignored real_colmap_sparse_* tests.
    # Default push/PR CI does not pull or assume this fixture.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'flowers2-parity'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            pkg-config \
            libeigen3-dev
      - name: Provision flowers2_colmap fixture
        run: ./scripts/provision_flowers2_colmap_fixture.sh
      - name: RustSFM ignored flowers2 parity suite
        run: >-
          cargo test -p rustscan-sfm --lib
          --features gpu-wgpu,vlfeat-sift
          -- --ignored --test-threads=1

  rustsfm-windows-filesystem:
    # No-default is a compile/codec gate. This job runs only filesystem tests
    # that do not require SIFT matching or a wgpu adapter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RustSFM filesystem publication tests
        run: >-
          cargo test -p rustscan-sfm --lib --no-default-features
          sequence_registration::task6_tests
