[package]
name = "rustscan"
version = "0.1.0"
edition = "2021"
description = "Workspace-level orchestration CLI for RustScan reconstruction workflows"
authors = ["RustScan Developers"]

[workspace]
members = ["rustscan-taskflow", "rustscan-types", "rustmesh", "rustslam", "rustgs", "rust-viewer", "rustff", "rustsfm"]
resolver = "2"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[patch.crates-io]
ceres-solver = { path = "third_party/rust/ceres-solver" }
ceres-solver-sys = { path = "third_party/rust/ceres-solver-sys" }
cubecl-common = { path = "third_party/rust/cubecl-common" }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
nalgebra = { workspace = true }
log = "0.4"
rustgs = { path = "rustgs" }
rustmesh = { path = "rustmesh" }
rustscan-types = { path = "rustscan-types" }
rustslam = { path = "rustslam", default-features = false }
