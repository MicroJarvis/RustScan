[package]
name = "rustsfm"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["ceres-ba", "vlfeat-sift", "gpu-wgpu", "poselib"]
gpu-wgpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]
lowe-sift-backend = []
poselib = []
ceres-ba = ["dep:ceres-solver"]
vlfeat-sift = []

[dependencies]
rustscan-types = { path = "../rustscan-types" }
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
glam = "0.25"
image = "0.25"
log = "0.4"
lowe-sift = "0.2.1"
nalgebra = "0.33"
pollster = { version = "0.3", optional = true }
rand = "0.8"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rustslam = { path = "../RustSLAM", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wgpu = { version = "29.0.1", features = ["wgsl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ceres-solver = { version = "0.5", optional = true, default-features = false, features = ["system"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ceres-solver = { version = "0.5", optional = true, default-features = false, features = ["source"] }

[build-dependencies]
cc = "1"

[lib]
name = "rustsfm"
path = "src/lib.rs"

[[bin]]
name = "rustsfm"
path = "src/main.rs"

[[bin]]
name = "twoview-diff"
path = "src/bin/twoview_diff.rs"

[[bin]]
name = "twoview-trace-diff"
path = "src/bin/twoview_trace_diff.rs"
